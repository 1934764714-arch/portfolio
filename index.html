<!--
THESIS: A concise Chinese developer portfolio focused on the work.
OWN-WORLD: Soft white, charcoal, and a restrained green accent; clear type, fine dividers, and plain project panels.
STORY: Meet 周劲弛 and scan four concise project examples.
FIRST VIEWPORT: A simple navigation bar, emoji avatar, two-line introduction, and project grid.
FORM: Minimal portfolio index; one centered column with a 2×2 project grid on wide screens.
-->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8f7">
  <title>周劲弛 — 开发者</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f8f7;
      --surface: #ffffff;
      --ink: #202722;
      --muted: #626b65;
      --rule: #e0e5e1;
      --accent: #32765a;
      --accent-strong: #286447;
      --accent-wash: #e9f1ec;
      --card-ink: #202722;
      --focus: #286447;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #171b18;
        --surface: #202521;
        --ink: #f0f3f0;
        --muted: #b3bdb6;
        --rule: #39423b;
        --accent: #8ec5a1;
        --accent-strong: #a5d4b4;
        --accent-wash: #26352b;
        --card-ink: #f0f3f0;
        --focus: #a5d4b4;
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --page: #f7f8f7;
      --surface: #ffffff;
      --ink: #202722;
      --muted: #626b65;
      --rule: #e0e5e1;
      --accent: #32765a;
      --accent-strong: #286447;
      --accent-wash: #e9f1ec;
      --card-ink: #202722;
      --focus: #286447;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #171b18;
      --surface: #202521;
      --ink: #f0f3f0;
      --muted: #b3bdb6;
      --rule: #39423b;
      --accent: #8ec5a1;
      --accent-strong: #a5d4b4;
      --accent-wash: #26352b;
      --card-ink: #f0f3f0;
      --focus: #a5d4b4;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--page);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.6;
      transition: background-color 180ms ease, color 180ms ease;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .page-shell {
      width: min(100% - 64px, 920px);
      margin-inline: auto;
    }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--rule);
    }

    .identity {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .identity-mark {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      background: var(--accent);
      transform: rotate(45deg);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 27px;
    }

    .nav-link {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: color 160ms ease;
    }

    .nav-link:hover {
      color: var(--accent-strong);
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: border-color 160ms ease, transform 160ms ease, background-color 180ms ease;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .theme-icon {
      color: var(--accent);
      font-size: 16px;
      line-height: 1;
    }

    main {
      padding: 64px 0 72px;
    }

    .intro {
      max-width: 100%;
      margin-bottom: 52px;
    }

    .intro-topline {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .avatar {
      display: grid;
      width: 50px;
      height: 50px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--rule));
      border-radius: 14px;
      background: var(--accent-wash);
      font-size: 27px;
      line-height: 1;
    }

    .intro-name {
      margin: 0;
      color: var(--accent-strong);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .intro h1 {
      margin: 0;
      max-width: 100%;
      font-size: clamp(34px, 4.4vw, 52px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.25;
      text-wrap: balance;
    }

    .intro h1 span {
      color: var(--accent);
    }

    .projects-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    .projects-heading h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 680;
      letter-spacing: -0.025em;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .project-card {
      min-height: 188px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 20px 22px 22px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: var(--surface);
      color: var(--card-ink);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .project-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    .project-icon {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      margin-bottom: 16px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--accent-strong);
      font-size: 20px;
      line-height: 1;
    }

    .project-card h3 {
      margin: 0 0 5px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
    }

    .project-card p {
      max-width: 43ch;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    @media (max-width: 640px) {
      .page-shell {
        width: min(100% - 40px, 480px);
      }

      .topbar {
        min-height: 72px;
      }

      .nav-actions {
        gap: 15px;
      }

      main {
        padding: 44px 0 52px;
      }

      .intro {
        margin-bottom: 38px;
      }

      .intro h1 {
        font-size: clamp(30px, 8vw, 40px);
      }

      .project-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .project-card {
        min-height: 0;
        padding: 18px 19px 20px;
      }
    }

    @media (max-width: 390px) {
      .page-shell {
        width: min(100% - 32px, 480px);
      }

      .identity {
        gap: 8px;
        font-size: 13px;
      }

      .nav-actions {
        gap: 11px;
      }

      .nav-link {
        font-size: 13px;
      }

      .theme-toggle {
        width: 40px;
        padding: 0;
      }

      .theme-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="identity" href="#" aria-label="周劲弛主页">
        <span class="identity-mark" aria-hidden="true"></span>
        <span>周劲弛</span>
      </a>
      <nav class="nav-actions" aria-label="主导航">
        <a class="nav-link" href="#projects">项目</a>
        <button class="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true">☾</span>
          <span class="theme-label">深色模式</span>
        </button>
      </nav>
    </header>

    <main>
      <section class="intro" aria-labelledby="intro-title">
        <div class="intro-topline">
          <span class="avatar" role="img" aria-label="开发者">👨🏻‍💻</span>
          <p class="intro-name">独立开发者</p>
        </div>
        <h1 id="intro-title">把想法变成好产品。<br><span>让复杂变简单。</span></h1>
      </section>

      <section id="projects" aria-labelledby="projects-title">
        <div class="projects-heading">
          <h2 id="projects-title">项目作品</h2>
        </div>
        <div class="project-grid">
          <article class="project-card">
            <span class="project-icon" aria-hidden="true">✳</span>
            <h3>轻记</h3>
            <p>轻松记录灵感，与团队一起整理思路。</p>
          </article>
          <article class="project-card">
            <span class="project-icon" aria-hidden="true">⌁</span>
            <h3>野迹</h3>
            <p>离线记录户外见闻、照片与地点。</p>
          </article>
          <article class="project-card">
            <span class="project-icon" aria-hidden="true">◷</span>
            <h3>专注时刻</h3>
            <p>简单规划专注时间，留出不被打扰的空间。</p>
          </article>
          <article class="project-card">
            <span class="project-icon" aria-hidden="true">↗</span>
            <h3>一站订单</h3>
            <p>在一个清晰的页面查看多平台订单。</p>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script>
    const themeToggle = document.querySelector(".theme-toggle");
    const themeIcon = themeToggle.querySelector(".theme-icon");
    const themeLabel = themeToggle.querySelector(".theme-label");

    themeToggle.addEventListener("click", () => {
      const currentTheme = document.documentElement.dataset.theme;
      const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const isDark = currentTheme ? currentTheme === "dark" : systemPrefersDark;
      const nextTheme = isDark ? "light" : "dark";

      document.documentElement.dataset.theme = nextTheme;
      themeToggle.setAttribute("aria-pressed", String(nextTheme === "dark"));
      themeToggle.setAttribute("aria-label", `切换到${nextTheme === "dark" ? "浅色" : "深色"}模式`);
      themeIcon.textContent = nextTheme === "dark" ? "☼" : "☾";
      themeLabel.textContent = nextTheme === "dark" ? "浅色模式" : "深色模式";
    });
  </script>
</body>
</html>
